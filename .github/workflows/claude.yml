name: Claude builds the change
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Claude may only edit the website files. It cannot change what `npm test` runs,
          # the workflows, the server or its own house rules.
          claude_args: '--max-turns 25 --allowedTools "Bash(npm test)" --disallowedTools "Edit(package.json),Write(package.json),Edit(scripts/**),Write(scripts/**),Edit(.github/**),Write(.github/**),Edit(server.js),Write(server.js),Edit(CLAUDE.md),Write(CLAUDE.md)"'
