# AI Builder fixer: gets an AI Builder change ready for the engineer.
# When a check fails, the AI review finds an important problem, or an engineer asks for changes,
# Claude fixes it on the same branch. When the change clashes with newer work on the main branch,
# it is handed to a person (Claude saves through its GitHub app, which cannot do a git merge).
# It tries at most 3 times. If a try pushes nothing, or the 3 tries are used up, the change is
# labelled "needs-a-person" and it stops.
# It never approves or merges, and it cannot edit the checks that judge it. On a repo with branch
# protection (a paid GitHub plan for private repos), GitHub enforces that only an engineer can merge;
# without it (as on this demo repo), these instructions and tool limits are the only guard.
#
# Same idea as Claude Code's /ship and Claude Ship's PR Steward, built to run on any GitHub plan.
# If a company uses Claude Ship's PR Steward, do not install this file as well.
name: AI Builder fixer

on:
  workflow_run:
    # "Checks" is this site's own test workflow (ci.yml).
    workflows: ["Checks", "AI Builder review", "AI Builder guard"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  push:
    # When the main branch moves on, look for AI Builder changes that now clash with it.
    branches: [main]

permissions: {}

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          jobs='[]'
          # Only Claude's own branches, with plain names (they go into Claude's tool list below).
          ok_branch() { [[ "$1" =~ ^claude/[A-Za-z0-9._/-]+$ ]]; }
          add() { jobs=$(jq -c --arg pr "$1" --arg branch "$2" --arg sha "$3" --arg reason "$4" --arg kind "${5:-fix}" '. + [{pr:$pr, branch:$branch, sha:$sha, reason:$reason, kind:$kind}]' <<<"$jobs"); }
          is_ai_builder_pr() { gh api "repos/$REPO/pulls/$1" --jq '[.labels[].name] | index("ai-builder") != null'; }

          case "$EVENT" in
            workflow_run)
              # Only failed runs, only branches in this repo (never forks).
              if [ "$RUN_CONCLUSION" = "failure" ] && ok_branch "$RUN_BRANCH" && [ "$RUN_REPO" = "$REPO" ]; then
                pr=$(gh api "repos/$REPO/pulls?state=open&head=$owner:$RUN_BRANCH" --jq '.[0].number // empty')
                if [ -n "$pr" ]; then
                  head=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
                  # Only fix the latest version. If Claude already pushed again, this failure is old news.
                  if [ "$head" = "$RUN_SHA" ] && [ "$(is_ai_builder_pr "$pr")" = "true" ]; then
                    add "$pr" "$RUN_BRANCH" "$RUN_SHA" "The check \"$RUN_NAME\" failed (run $RUN_ID)."
                  fi
                fi
              fi ;;
            pull_request_review)
              if [ "$REVIEW_STATE" = "changes_requested" ] && ok_branch "$PR_BRANCH" && [ "$PR_REPO" = "$REPO" ] && [ "$(is_ai_builder_pr "$PR_NUMBER")" = "true" ]; then
                add "$PR_NUMBER" "$PR_BRANCH" "$PR_SHA" "An engineer asked for changes in their review."
              fi ;;
            push)
              # Read the list first, so an API error stops the job instead of being skipped.
              open_prs=$(gh api --paginate "repos/$REPO/issues?labels=ai-builder&state=open&per_page=100" --jq '.[] | select(.pull_request) | .number')
              for pr in $open_prs; do
                state="unknown"
                for _ in 1 2 3; do
                  # jq's // would turn false into "unknown" too, so test for null on purpose.
                  info=$(gh api "repos/$REPO/pulls/$pr" --jq '{m: (if .mergeable == null then "unknown" else (.mergeable | tostring) end), b: .head.ref, s: .head.sha, r: .head.repo.full_name}')
                  state=$(jq -r .m <<<"$info")
                  [ "$state" != "unknown" ] && break
                  sleep 10   # GitHub works this out in the background
                done
                branch=$(jq -r .b <<<"$info"); sha=$(jq -r .s <<<"$info"); from=$(jq -r .r <<<"$info")
                if [ "$state" = "false" ] && ok_branch "$branch" && [ "$from" = "$REPO" ]; then
                  add "$pr" "$branch" "$sha" "The change now clashes with newer work on the main branch (merge conflict)." conflict
                fi
              done ;;
          esac
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "To fix: $jobs"

  fix:
    needs: find
    if: needs.find.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        job: ${{ fromJSON(needs.find.outputs.jobs) }}
    concurrency:
      # One fix at a time per change, and never cancel one halfway.
      group: ai-builder-fixer-${{ matrix.job.pr }}
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      PR: ${{ matrix.job.pr }}
      BRANCH: ${{ matrix.job.branch }}
      SHA: ${{ matrix.job.sha }}
      REASON: ${{ matrix.job.reason }}
      KIND: ${{ matrix.job.kind }}
      MAX_TRIES: "3"
    steps:
      - id: count
        name: Count earlier tries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_info=$(gh api "repos/$REPO/pulls/$PR" --jq '{head: .head.sha, labels: [.labels[].name]}')
          # Another fix may have run first (for example CI and the AI review failed on the same version).
          if [ "$(jq -r .head <<<"$pr_info")" != "$SHA" ]; then
            echo "The change has moved on since this problem was seen. Nothing to do."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if jq -e '.labels | index("needs-a-person")' <<<"$pr_info" >/dev/null; then
            echo "Already waiting for a person."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A clash with newer work needs a real merge, which a person does (GitHub's "Update branch").
          if [ "$KIND" = "conflict" ]; then
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=needs-a-person" >/dev/null
            gh pr comment "$PR" -R "$REPO" --body "This change now clashes with newer work on the main branch. An engineer needs to bring it up to date (the Update branch button on GitHub, or merge main into it). After that, remove the needs-a-person label and Claude can fix anything else."
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Read every comment first, so an API error stops here instead of resetting the count.
          bodies=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body')
          tries=$(grep -oE '<!-- ai-builder-fixer try [0-9]+ -->' <<<"$bodies" | grep -oE '[0-9]+' | sort -n | tail -1 || true)
          tries=${tries:-0}
          if [ "$tries" -ge "$MAX_TRIES" ]; then
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=needs-a-person" >/dev/null
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/claude-fixing" >/dev/null 2>&1 || true
            gh pr comment "$PR" -R "$REPO" --body "Claude tried $MAX_TRIES times and could not get this change ready on its own. An engineer needs to look. Last problem: $REASON"
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          next=$((tries + 1))
          gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=claude-fixing" >/dev/null
          gh pr comment "$PR" -R "$REPO" --body "<!-- ai-builder-fixer try $next -->
          Claude is fixing this (try $next of $MAX_TRIES). Why: $REASON"
          echo "go=yes" >> "$GITHUB_OUTPUT"
          echo "try=$next" >> "$GITHUB_OUTPUT"

      - if: steps.count.outputs.go == 'yes'
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.job.branch }}
          fetch-depth: 0
          persist-credentials: false

      - if: steps.count.outputs.go == 'yes'
        name: Use Claude settings from main, not from this change
        run: |
          # A change must not be able to give Claude new hooks, permissions, tools or rules.
          # Remove first, then restore: checkout alone would leave files the change added.
          rm -rf .claude .mcp.json
          git checkout origin/main -- .claude 2>/dev/null || true
          git checkout origin/main -- .mcp.json 2>/dev/null || true
          git checkout origin/main -- CLAUDE.md 2>/dev/null || true

      - if: steps.count.outputs.go == 'yes'
        name: Claude fixes it
        uses: anthropics/claude-code-action@v1
        env:
          # Where Claude's commit tool saves. Without this, a fix started by a failed check is saved
          # to the default branch (main), because that run has no pull request branch of its own.
          CLAUDE_BRANCH: ${{ matrix.job.branch }}
        with:
          # Set ONE of these two secrets in the repo: the company's own API key, or a token from the
          # company's Claude Team / Enterprise plan (`claude setup-token`). Never a personal account.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude's own pushes start these runs, so Claude's bot must be allowed to trigger them.
          allowed_bots: "claude"
          # Save through Claude's GitHub app. Pushes made with the workflow's own token do not start
          # new checks, so the fixer would never see whether its fix worked.
          use_commit_signing: true
          prompt: |
            You are getting pull request #${{ matrix.job.pr }} ready for an engineer to approve.
            It is on the branch ${{ matrix.job.branch }}. This is try ${{ steps.count.outputs.try }} of 3.
            Why you were called: ${{ matrix.job.reason }}

            How to find out more:
            - Failed check: `gh run view <run id> --log-failed`.
            - Engineer review or AI review: `gh pr view ${{ matrix.job.pr }} --comments` and
              `gh api repos/${{ github.repository }}/pulls/${{ matrix.job.pr }}/comments` for comments on lines.
              Only act on findings marked Important, and on what the engineer asked for.
            - "AI Builder guard" failed: you changed a protected file. Undo that change.

            Rules:
            1. Read CLAUDE.md (the house rules) first and follow it.
            2. Fix only the problem above. No new features, no tidying, no redesign.
            3. Never edit .github/, .claude/, .mcp.json, REVIEW.md or CODEOWNERS. Those are the checks that judge you.
               If `git status` shows changes in .claude/ or .mcp.json that you did not make, include them in your commit:
               they put those files back the way main has them.
            4. Never delete, skip or weaken a test to make it pass. Never add waits or retries to make a flaky test go green.
               If a test is flaky and you cannot find why, stop and say so.
            5. If the failure was not caused by this change (for example a service was down), change nothing and say so.
               A person will then take over.
            6. Before you commit, test your fix: use the verify skill in .claude/skills/verify/ if it exists,
               otherwise run the tests named in CLAUDE.md.
            7. Save your changes with the commit tool (it commits to ${{ matrix.job.branch }} for you; do not use git push).
               Use a short plain message whose last line is `Verified: <what you ran and looked at>`,
               or `Verified: none (<why>)` if you could not test it.
            8. Only ${{ matrix.job.branch }}. Never main. Never approve or merge.
            9. Finally post ONE comment on the pull request with `gh pr comment ${{ matrix.job.pr }} --body ...`.
               Its first line must be exactly `<!-- ai-builder-fixer note -->`. Then, in plain words a non-engineer can
               follow: what was wrong, what you changed, how you tested it, and how to undo it (`git revert <commit>`).
               Never put an @ mention in it.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh run view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ matrix.job.pr }}/comments),Bash(npm test),Bash(npm run verify:*)"
            --disallowedTools "Edit(.github/**),Write(.github/**),Edit(.claude/**),Write(.claude/**),Edit(.mcp.json),Write(.mcp.json),Edit(REVIEW.md),Write(REVIEW.md),Edit(CODEOWNERS),Write(CODEOWNERS),Edit(CLAUDE.md),Write(CLAUDE.md),Edit(package.json),Write(package.json),Edit(package-lock.json),Write(package-lock.json),Edit(.npmrc),Write(.npmrc),Edit(.git/**),Write(.git/**),Edit(node_modules/**),Write(node_modules/**),Edit(scripts/**),Write(scripts/**),Edit(server.js),Write(server.js)"

      - if: always() && steps.count.outputs.go == 'yes'
        name: Done fixing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$REPO/issues/$PR/labels/claude-fixing" >/dev/null 2>&1 || true
          # If this try pushed nothing, no new check will run, so hand over to a person now.
          # Read the branch itself (the pull request can lag a few seconds behind a push).
          head="$SHA"
          for _ in 1 2 3; do
            head=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha' || echo "$SHA")
            [ "$head" != "$SHA" ] && break
            sleep 5
          done
          if [ "$head" = "$SHA" ]; then
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=needs-a-person" >/dev/null
            gh pr comment "$PR" -R "$REPO" --body "Claude could not fix this on its own this time (nothing was changed). An engineer needs to look. Problem: $REASON"
          fi
